<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SchoolOS bridge</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>SchoolOS bridge</span>
      </div>
      <div class="top-right" id="topRight" hidden>
        <span class="pill" id="serviceState">…</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Chiqish</button>
      </div>
    </header>

    <!-- Shown until a session exists -->
    <main class="gate" id="gate">
      <div class="gate-card">
        <h1 id="gateTitle">Kirilmoqda…</h1>
        <p id="gateText">Bir lahza.</p>
      </div>
    </main>

    <main class="wrap" id="app" hidden>
      <p class="service-error" id="serviceError" role="alert" hidden></p>

      <!-- 1. Cloud -->
      <section class="card" aria-labelledby="cloudTitle">
        <div class="card-head">
          <h2 id="cloudTitle"><span class="num">1</span> Bulut</h2>
          <span class="pill" id="cloudState" hidden></span>
        </div>
        <div class="card-body grid-2">
          <label class="field">
            <span>Bulut manzili</span>
            <input id="cloudUrl" type="text" inputmode="url" placeholder="https://tochna.uz" autocomplete="off" spellcheck="false" />
          </label>
          <label class="field">
            <span>Bridge tokeni <em id="tokenHint"></em></span>
            <input id="cloudToken" type="password" placeholder="Terminallar sahifasidagi token" autocomplete="off" spellcheck="false" />
          </label>
        </div>
        <div class="card-foot">
          <button class="btn btn-secondary" id="cloudTest" type="button">Aloqani tekshirish</button>
          <p class="note" id="cloudNote">Token SchoolOS → Terminallar → Bridge bo'limida bir marta ko'rsatiladi.</p>
        </div>
      </section>

      <!-- 2. Terminals -->
      <section class="card" aria-labelledby="termTitle">
        <div class="card-head">
          <h2 id="termTitle"><span class="num">2</span> Terminallar</h2>
          <span class="pill" id="scanState" hidden></span>
        </div>
        <div class="card-body">
          <div class="scan-row">
            <label class="field grow">
              <span>Tarmoq</span>
              <input id="scanTarget" type="text" placeholder="192.168.1.0/24" autocomplete="off" spellcheck="false" />
            </label>
            <button class="btn btn-secondary" id="scanBtn" type="button">Skanerlash</button>
            <button class="btn btn-ghost" id="addManual" type="button" aria-expanded="false" aria-controls="manualRow">IP qo'shish</button>
          </div>
          <form class="manual-row" id="manualRow" hidden novalidate>
            <label class="field grow">
              <span>Terminal IP manzili</span>
              <input id="manualIp" type="text" inputmode="decimal" placeholder="192.168.1.64" autocomplete="off" spellcheck="false" aria-describedby="manualErr" />
            </label>
            <button class="btn btn-secondary" type="submit">Qo'shish</button>
            <button class="btn btn-ghost" id="manualCancel" type="button">Bekor</button>
            <p class="field-err full" id="manualErr" role="alert" hidden></p>
          </form>
          <div class="term-list" id="termList"></div>
        </div>
      </section>

      <div class="checks" id="checks" hidden></div>
    </main>

    <footer class="savebar" id="saveBar" hidden>
      <p class="note" id="saveHint" aria-live="polite"></p>
      <button class="btn btn-primary" id="saveBtn" type="button">Saqlash</button>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastText"></span><button class="toast-action" id="toastAction" type="button" hidden></button></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
